[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observability-generator"
version = "0.1.0"
description = "Synthetic telemetry generator for the observability platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0,<1.0",
]

[project.scripts]
generate-telemetry = "generate_telemetry:main"

[tool.setuptools]
py-modules = ["generate_telemetry"]
