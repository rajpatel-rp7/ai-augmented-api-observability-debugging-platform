services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observability}
      POSTGRES_DB: ${POSTGRES_DB:-observability}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observability} -d ${POSTGRES_DB:-observability}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.name: observability-local
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_ZIPKIN_PORT:-9411}:9411"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-observability-platform}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://observability:observability@postgres:5432/observability}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ELASTICSEARCH_LOGS_INDEX: ${ELASTICSEARCH_LOGS_INDEX:-observability-logs}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_LOGS_STREAM: ${REDIS_LOGS_STREAM:-telemetry.logs}
      REDIS_INCIDENT_EVENTS_STREAM: ${REDIS_INCIDENT_EVENTS_STREAM:-telemetry.incident-events}
      REDIS_DETECTION_CONSUMER_GROUP: ${REDIS_DETECTION_CONSUMER_GROUP:-detection-workers}
      JAEGER_QUERY_URL: ${JAEGER_QUERY_URL:-http://jaeger:16686}
      JAEGER_ZIPKIN_URL: ${JAEGER_ZIPKIN_URL:-http://jaeger:9411}
      DETECTION_ENABLED: ${DETECTION_ENABLED:-true}
      DETECTION_INTERVAL_SECONDS: ${DETECTION_INTERVAL_SECONDS:-60}
      DETECTION_LOOKBACK_MINUTES: ${DETECTION_LOOKBACK_MINUTES:-15}
      DETECTION_ERROR_LOG_THRESHOLD: ${DETECTION_ERROR_LOG_THRESHOLD:-5}
      DETECTION_ERROR_LOG_WINDOW_MINUTES: ${DETECTION_ERROR_LOG_WINDOW_MINUTES:-5}
      DETECTION_TRACE_LATENCY_MS: ${DETECTION_TRACE_LATENCY_MS:-2000}
      DETECTION_TRACE_ERROR_THRESHOLD: ${DETECTION_TRACE_ERROR_THRESHOLD:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      AI_ANALYSIS_FORCE_STUB: ${AI_ANALYSIS_FORCE_STUB:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  generator:
    profiles: ["demo"]
    build:
      context: ./generators
      dockerfile: Dockerfile
    environment:
      # CLI args still win; env kept for documentation / overrides in future
      API_URL: http://api:8000
    command:
      - --api-url
      - http://api:8000
      - --loop
      - --interval
      - "${GENERATOR_INTERVAL_SECONDS:-45}"
      - --burst
      - "${GENERATOR_BURST:-6}"
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    profiles: ["demo"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  elasticsearch_data:
  redis_data:
  prometheus_data:
  grafana_data:
