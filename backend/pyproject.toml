[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "observability-platform"
version = "0.1.0"
description = "AI-augmented API observability and auto-debugging platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic-settings>=2.6.0,<3.0",
    "psycopg[binary]>=3.2.0,<4.0",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14.0,<2.0",
    "prometheus-client>=0.21.0,<1.0",
    "elasticsearch>=8.15.0,<9.0",
    "redis>=5.1.0,<6.0",
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "httpx>=0.27.0,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
