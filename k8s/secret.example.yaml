# Copy to secret.yaml and fill values before applying.
# Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: observability-api-secrets
  namespace: observability
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: observability-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://observability:CHANGE_ME@postgres:5432/observability"
  POSTGRES_PASSWORD: "CHANGE_ME"
  OPENAI_API_KEY: ""
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME"
