apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-api-config
  namespace: observability
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: observability-platform
data:
  APP_ENV: "production"
  APP_NAME: "observability-platform"
  LOG_LEVEL: "INFO"
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  ELASTICSEARCH_LOGS_INDEX: "observability-logs"
  REDIS_URL: "redis://redis:6379/0"
  REDIS_LOGS_STREAM: "telemetry.logs"
  REDIS_INCIDENT_EVENTS_STREAM: "telemetry.incident-events"
  REDIS_DETECTION_CONSUMER_GROUP: "detection-workers"
  JAEGER_QUERY_URL: "http://jaeger:16686"
  JAEGER_ZIPKIN_URL: "http://jaeger:9411"
  DETECTION_ENABLED: "true"
  DETECTION_INTERVAL_SECONDS: "60"
  DETECTION_LOOKBACK_MINUTES: "15"
  DETECTION_ERROR_LOG_THRESHOLD: "5"
  DETECTION_ERROR_LOG_WINDOW_MINUTES: "5"
  DETECTION_TRACE_LATENCY_MS: "2000"
  DETECTION_TRACE_ERROR_THRESHOLD: "1"
  AI_ANALYSIS_ENABLED: "true"
  AI_ANALYSIS_FORCE_STUB: "false"
  OPENAI_MODEL: "gpt-4o-mini"
  CORS_ORIGINS: "http://localhost:5173,http://frontend.observability.svc.cluster.local"
